<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Test</title><style>body{font:18px system-ui;background:#111;color:#eee;padding:16px}button{display:block;width:100%;margin:10px 0;padding:16px;font-size:18px;border-radius:10px}#log{white-space:pre-wrap;font-size:15px}</style></head><body>
<h2>Echoes audio test</h2><p>Tap each button. Note which ones make sound.</p>
<button onclick="beep()">1. Web Audio beep</button>
<button onclick="dec('t.ogg')">2. Web Audio decode OGG</button>
<button onclick="dec('t.mp3')">3. Web Audio decode MP3</button>
<button onclick="el('t.ogg')">4. HTML audio OGG</button>
<button onclick="el('t.mp3')">5. HTML audio MP3</button>
<div id="log"></div>
<script>
var ctx=null;function L(s){document.getElementById('log').textContent+=s+'\n';}
function C(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:44100});L('ctx rate '+ctx.sampleRate);}ctx.resume();return ctx;}
function beep(){var c=C(),o=c.createOscillator(),g=c.createGain();g.gain.value=0.3;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.4);L('1: state '+c.state);}
function dec(u){var c=C();fetch(u).then(r=>r.arrayBuffer()).then(b=>c.decodeAudioData(b)).then(buf=>{var s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);s.start();L(u+' decoded OK '+buf.duration.toFixed(2)+'s');}).catch(e=>L(u+' decode FAILED: '+e));}
function el(u){var a=new Audio(u);a.play().then(()=>L(u+' element playing')).catch(e=>L(u+' element FAILED: '+e));}
L('UA: '+navigator.userAgent);
</script></body></html>
